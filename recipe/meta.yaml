{% set version = "8.3.7" %}

package:
  name: mongodb
  version: {{ version }}

source:
  url: https://github.com/mongodb/mongo/archive/refs/tags/r{{ version }}.tar.gz
  sha256: d0179a61d3e126a6fce328db38e5f7568f24dfb1a33748d1b994b7fe641c7d88
  patches:
    - patches/0001-Disable-mongo_apple_toolchain-registration-for-native-macOS-builds.patch  # [osx]
    - patches/0002-Make-tool_to_path-basename-check-tolerate-cross-prefixed-compilers.patch
    - patches/0003-mozjs-gate-wrapper-comparison-operators-ElementType-behind-DefineComparisonOps-for-MSVC-14.4x.patch  # [win]
    - patches/0004-mozjs-constrain-ProtectedData-for-C-20-MSVC-14.4x.patch  # [win]
    - patches/0005-resharding_util-split-deeply-nested-pipeline-literals-to-avoid-MSVC-C1060.patch  # [win]
build:
  number: 0
  # MongoDB distributes ppc64le only for Enterprise Edition
  skip: true  # [ppc64le]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    # 8.0's .bazelversion pins bazel 7.5; 7.6+ drops flags mongo's .bazelrc uses.
    - bazel =7.5
    - bazel-toolchain  # [not win]
    - python >=3.10
    - pip
  host:
    - openssl
    - libcurl
    - cyrus-sasl

test:
  commands:
    - mongod --version
    - mongos --version
    - mongod --help
    - mongos --help

about:
  home: https://www.mongodb.com/
  license: SSPL-1.0
  license_family: OTHER
  # mongod/mongos statically link all vendored third-party libs. Per
  # README.third_party.md these are covered by mongo's consolidated
  # distsrc/THIRD-PARTY-NOTICES or each lib's own LICENSE (below). folly and
  # zstd are not in THIRD-PARTY-NOTICES (added with the Bazel build), so their
  # LICENSE files are listed explicitly.
  license_file:
    - LICENSE-Community.txt
    - distsrc/THIRD-PARTY-NOTICES
    - README.third_party.md
    - src/third_party/abseil-cpp/dist/LICENSE
    - src/third_party/asio-master/asio/LICENSE_1_0.txt
    - src/third_party/fmt/dist/LICENSE.rst
    - src/third_party/folly/dist/LICENSE
    - src/third_party/gperftools/dist/COPYING
    - src/third_party/icu4c-57.1/LICENSE
    - src/third_party/immer/dist/LICENSE
    - src/third_party/IntelRDFPMathLib20U1/eula.txt
    - src/third_party/libbson/dist/COPYING
    - src/third_party/librdkafka/dist/LICENSE
    - src/third_party/pcre2/LICENCE
    - src/third_party/s2/LICENSE-2.0.txt
    - src/third_party/snappy/dist/COPYING
    - src/third_party/tcmalloc/dist/LICENSE
    - src/third_party/timelib/dist/LICENSE.rst
    - src/third_party/tomcrypt-1.18.2/LICENSE
    - src/third_party/unwind/dist/COPYING
    - src/third_party/wiredtiger/LICENSE
    - src/third_party/yaml-cpp/yaml-cpp/LICENSE
    - src/third_party/zstandard/zstd/COPYING
  summary: The MongoDB Database
  description: |
    MongoDB is a general-purpose, document-based, distributed database built
    for modern application developers and for the cloud era. This package
    provides the community edition `mongod` server and `mongos` router.
    The legacy `mongo` shell was removed in MongoDB 8.0.
  doc_url: https://docs.mongodb.com/
  dev_url: https://github.com/mongodb/mongo

extra:
  recipe-maintainers:
    - nehaljwani
    - h-vetinari
    - tropicrainforest
