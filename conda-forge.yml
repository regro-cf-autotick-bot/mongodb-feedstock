build_platform:
  osx_64: osx_arm64
conda_build:
  pkg_format: '2'
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
github_actions:
  timeout_minutes: 720
  triggers:
  - push
  - pull_request
provider:
  linux_64: github_actions
  linux_aarch64: github_actions
  osx_arm64: default
  osx_64: default
  win_64: github_actions
test: native_and_emulated
workflow_settings:
  pagefile_size:
    - value: 20
      os: win
